<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MARINE CHARACTER MASTER</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eaf7ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#123}main{max-width:980px;margin:auto;padding:14px}h1{color:#0878bd}.box{background:#fff;border:2px solid #9bd6f4;border-radius:16px;padding:14px;margin:11px 0}input{width:100%;padding:9px;margin:4px 0;border:1px solid #9bd6f4;border-radius:8px}button{border:0;border-radius:9px;padding:9px 11px;margin:3px;background:#1686c9;color:#fff;font-weight:800}.danger{background:#b94b4b}.small{font-size:11px;color:#567;line-height:1.6}.item{border-top:1px solid #def;padding:10px 0}.top{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.top b{flex:1}.thumb{width:76px;height:76px;object-fit:contain;background:#eef9ff;border-radius:50%}.checks{display:flex;gap:10px;flex-wrap:wrap}.checks label{background:#eef9ff;padding:6px;border-radius:8px;font-size:11px}</style></head><body><main>
<h1>🐠 MARINE CHARACTER MASTER</h1><div class="small">MASTER更新：2026/09/03 22:08</div>
<div class="box"><h2>🌊 共通キャラクター画像ライブラリ</h2><div class="small">画像を一度だけ登録し、アイコン・服用スタンプ・すごろく等から共通利用するためのJSONを作ります。固定IDは一度公開したら変更しないでください。</div></div>
<div class="box"><h2>🗜️ 公開画像の軽量化</h2><label>最大辺(px)<input id="maxPx" type="number" value="256" min="64" max="1024"></label><label>WebP画質<input id="quality" type="number" value="0.78" min=".3" max="1" step=".01"></label><div class="small">元画像はそのまま。JSONへ書き出す画像だけ縮小・WebP圧縮します。</div></div>
<div class="box"><h2>🐠 キャラクター登録</h2><div id="list"></div><button id="add">＋ キャラクター追加</button></div>
<div class="box"><h2>📦 書き出し</h2><button id="export">characters.json を書き出す</button><div class="small">各アプリはこのJSONから、固定ID・名前・軽量画像・用途設定を読み取れます。</div></div>
</main><script>
let chars=[];
const E=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function uid(){return"character_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,6)}
function render(){list.innerHTML="";chars.forEach((x,i)=>{let d=document.createElement("div");d.className="item";d.innerHTML=`<div class="top">${x.src?'<img class="thumb" src="'+x.src+'">':""}<b>${E(x.name||"キャラクター")}</b><button data-up="${i}">↑</button><button data-down="${i}">↓</button><button class="danger" data-del="${i}">削除</button></div><input type="file" accept="image/*" data-img="${i}"><input data-i="${i}" data-k="name" value="${E(x.name)}" placeholder="キャラクター名"><input data-i="${i}" data-k="id" value="${E(x.id)}" placeholder="固定ID"><div class="checks"><label><input style="width:auto" type="checkbox" data-use="icon:${i}" ${x.icon?"checked":""}> アイコン</label><label><input style="width:auto" type="checkbox" data-use="medicine:${i}" ${x.medicine?"checked":""}> 服用スタンプ</label><label><input style="width:auto" type="checkbox" data-use="sugoroku:${i}" ${x.sugoroku?"checked":""}> すごろく</label><label><input style="width:auto" type="checkbox" data-use="active:${i}" ${x.active?"checked":""}> 公開中</label></div>`;list.appendChild(d)})}
list.oninput=e=>{if(e.target.dataset.i!==undefined)chars[+e.target.dataset.i][e.target.dataset.k]=e.target.value};
list.onchange=e=>{if(e.target.dataset.img!==undefined){let i=+e.target.dataset.img,f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{chars[i].src=r.result;render()};r.readAsDataURL(f)}if(e.target.dataset.use){let [k,i]=e.target.dataset.use.split(":");chars[+i][k]=e.target.checked;render()}};
list.onclick=e=>{let i;if(e.target.dataset.up!==undefined){i=+e.target.dataset.up;if(i>0)[chars[i-1],chars[i]]=[chars[i],chars[i-1]];render()}if(e.target.dataset.down!==undefined){i=+e.target.dataset.down;if(i<chars.length-1)[chars[i+1],chars[i]]=[chars[i],chars[i+1]];render()}if(e.target.dataset.del!==undefined){chars.splice(+e.target.dataset.del,1);render()}};
add.onclick=()=>{chars.push({id:uid(),name:"",src:"",icon:true,medicine:true,sugoroku:true,active:true});render()};
async function compress(src,max,q){if(!src)return"";let im=new Image();await new Promise((ok,no)=>{im.onload=ok;im.onerror=no;im.src=src});let sc=Math.min(1,max/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*sc)),h=Math.max(1,Math.round(im.height*sc)),c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);return c.toDataURL("image/webp",q)}
export.onclick=async()=>{let out={schema:"marine-characters-v1",updated:new Date().toISOString(),characters:[]},max=+maxPx.value||256,q=+quality.value||.78;for(let x of chars){out.characters.push({id:x.id,name:x.name,image:await compress(x.src,max,q),uses:{icon:x.icon,medicine:x.medicine,sugoroku:x.sugoroku},active:x.active})}let blob=new Blob([JSON.stringify(out,null,2)],{type:"application/json;charset=utf-8"}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="characters.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
render();</script></body></html>
